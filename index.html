<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsite Token - Plain HTML</title>
  <!-- Kita gunakan Tailwind CSS via CDN agar styling persis seperti Next.js -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">

  <!-- Komponen UI -->
  <div class="flex flex-col gap-4 font-mono text-sm/6 text-center p-4">
    <div id="token-display" class="bg-green-100 text-green-800 p-2 rounded break-words">
      Token: Menunggu token...
    </div>
    
    <button 
      id="btn-confirmation"
      class="mt-2 bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded"
    >
      Confirmation
    </button>
  </div>

  <!-- Memanggil Script JS bawaan dari Mini Program -->
  <!-- Kita tambahkan onload agar langsung menjalankan fungsi saat bridge sudah siap -->
  <script src="https://appx/web-view.min.js" onload="onBridgeReady()"></script>

  <!-- Logika JS Native (Vanilla JS) -->
  <script>
    const tokenDisplay = document.getElementById('token-display');
    const btnConfirmation = document.getElementById('btn-confirmation');

    // Fungsi menangkap pesan / data (Pengganti handleOnMessage di React)
    const handleOnMessage = (data) => {
      try {
        if (data && data.token) {
          tokenDisplay.innerText = "Token: " + data.token;
        } else {
          throw new Error("Token is undefined in data: " + JSON.stringify(data));
        }
      } catch (error) {
        tokenDisplay.innerText = "Error parsing token: " + error.message;
      }
    };

    // Dijalankan begitu script H5 Hylid / mPaaS / Alipay selesai di-load
    function onBridgeReady() {
      const win = window;
      if (typeof win !== "undefined" && win.my) {
        
        // Listen balasan dari Mini Program
        win.my.onMessage = handleOnMessage;
        
        // Mengirim request token ke Mini Program
        if (typeof win.my.postMessage === "function") {
          win.my.postMessage({ action: "getToken" });
        }
      }
    }

    // Aksi saat tombol ditekan (Pengganti navigateToConfirmation di React)
    btnConfirmation.addEventListener("click", () => {
      const win = window;
      
      if (typeof win !== "undefined" && win.my && typeof win.my.postMessage === "function") {
        // Data yang dikirim ke mini program
        const dataToSend = {
          source: "webview_plain_html",
          userId: 999,
          token: "secret_token_123" 
        };
        
        win.my.postMessage({ 
          action: "goToConfirmation",
          payload: dataToSend
        });
      } else {
        // Fallback alert jika bridge belum ada
        if (win.my && win.my.alert) {
          win.my.alert({ content: "window.my.postMessage belum tersedia!" });
        } else {
          window.alert("window.my.postMessage belum tersedia!");
        }
      }
    });

  </script>
</body>
</html>
